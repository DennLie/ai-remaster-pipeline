name: Scientific synthetic restoration evaluation (CPU)

on:
  pull_request:
    paths:
      - "scripts/restoration_evaluation.py"
      - "tests/test_restoration_evaluation.py"
      - "scripts/run_scientific_classical_grid.py"
      - "tests/test_scientific_classical_grid.py"
      - "scripts/evaluate_steps_1to5.py"
      - "scripts/film_deflicker.py"
      - "tests/test_evaluate_steps_1to5.py"
      - "docs/evaluate-steps-1-to-5.md"
      - "docs/scientific-restoration-evaluation.md"
      - ".github/workflows/scientific-restoration-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-reference-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg and pinned-range scientific dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "scikit-image>=0.25,<0.28"
      - name: Validate seeded damage and exact-reference FFV1 scores
        run: python -m unittest -v tests.test_restoration_evaluation
      - name: Execute actual classical Off/CAS/Richardson-Lucy algorithms and evaluate synthetic recovery
        run: python -m unittest -v tests.test_scientific_classical_grid
      - name: Verify FFmpeg stabilization/denoise backends exist
        run: |
          ffmpeg -hide_banner -filters | grep vidstabdetect
          ffmpeg -hide_banner -filters | grep vidstabtransform
          ffmpeg -hide_banner -filters | grep bm3d
      - name: Exercise actual CPU stages 1, 2, 4, 5 on known synthetic damage
        run: python -m unittest -v tests.test_evaluate_steps_1to5
      - name: Validate prior frame/source benchmark guards
        run: python -m unittest -v tests.test_step3_benchmark
