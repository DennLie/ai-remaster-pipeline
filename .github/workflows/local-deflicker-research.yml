name: Localized Deflicker research (CPU)

on:
  pull_request:
    paths:
      - 'scripts/local_deflicker_research.py'
      - 'tests/test_local_deflicker_research.py'
      - 'tests/test_local_deflicker_pilot.py'
      - 'scripts/evaluate_local_deflicker_pilot.py'
      - 'docs/local-deflicker-research.md'
      - '.github/workflows/local-deflicker-research.yml'
  push:
    branches:
      - research/localized-deflicker-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-defect-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lightweight CPU libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless
      - name: Compile prototype and tests
        run: python -m py_compile scripts/local_deflicker_research.py scripts/evaluate_local_deflicker_pilot.py tests/test_local_deflicker_research.py tests/test_local_deflicker_pilot.py
      - name: Synthetic and moving-scene controls
        run: python -m unittest -v tests.test_local_deflicker_research tests.test_local_deflicker_pilot
      - name: Short FFmpeg-generated motion clip (NOT authentic film)
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=128x96:rate=12:duration=2 -an -c:v ffv1 -y /tmp/local_research_input.mkv
          python scripts/evaluate_local_deflicker_pilot.py --source /tmp/local_research_input.mkv --report /tmp/local_research_pilot.json --max-frames 30 --sigma 8 --compare-guards
          python -c 'import json; d=json.load(open("/tmp/local_research_pilot.json")); assert d["frames"]==24 and d["release_ready"] is False; assert "untouched_original_modified_mae" in d and "guard_comparison" in d; assert d["guard_comparison"]["release_ready"] is False'
      - name: Upload research-only benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-local-deflicker-benchmark
          path: /tmp/local_research_pilot.json
          retention-days: 14
