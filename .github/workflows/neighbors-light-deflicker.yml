name: Neighbors native-source Light Deflicker QA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-film-deflicker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CPU dependencies and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download original Wikimedia Commons digital transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film" "$RUNNER_TEMP/deflick_results"
          curl -fL --retry 3 --retry-all-errors --retry-delay 4 --connect-timeout 40 --max-time 660 \
            -A "ARP archival-film restoration research (https://github.com/DennLie/ai-remaster-pipeline)" \
            "https://upload.wikimedia.org/wikipedia/commons/2/27/Neighbors_%281920%29.webm" \
            -o "$RUNNER_TEMP/film/neighbors_original_960x720.webm"
          test "$(ffprobe -v error -show_entries stream=width -of csv=p=0 "$RUNNER_TEMP/film/neighbors_original_960x720.webm")" = "960"
          test "$(ffprobe -v error -show_entries stream=height -of csv=p=0 "$RUNNER_TEMP/film/neighbors_original_960x720.webm")" = "720"
          sha256sum "$RUNNER_TEMP/film/neighbors_original_960x720.webm"

      - name: Extract an unchanged-resolution four-second archival test excerpt
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 00:05:00 \
            -i "$RUNNER_TEMP/film/neighbors_original_960x720.webm" \
            -t 4 -map 0:v:0 -an -c:v ffv1 -level 3 -pix_fmt yuv420p \
            "$RUNNER_TEMP/film/Neighbors_native_720p.mkv"

      - name: Apply optional model-free Light Deflicker at source resolution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cleanup_video.py \
            --source "$RUNNER_TEMP/film/Neighbors_native_720p.mkv" \
            --output "$RUNNER_TEMP/film/Neighbors_light_deflicked.mkv" \
            --light-deflicker --deflicker-strength 0.65 \
            --deflicker-max-correction 0.08 \
            --no-dearchive --intermediate-profile lossless
          python scripts/compare_light_deflicker.py \
            --original "$RUNNER_TEMP/film/Neighbors_native_720p.mkv" \
            --corrected "$RUNNER_TEMP/film/Neighbors_light_deflicked.mkv" \
            --output-dir "$RUNNER_TEMP/deflick_results"
          cat "$RUNNER_TEMP/deflick_results/light_deflicker_compare.json"

      - name: Benchmark the built-in FFmpeg median Deflicker on the same native footage
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i "$RUNNER_TEMP/film/Neighbors_native_720p.mkv" \
            -vf "deflicker=size=5:mode=median" -an \
            -c:v ffv1 -pix_fmt yuv420p \
            "$RUNNER_TEMP/film/Neighbors_ffmpeg_deflicker.mkv"
          python scripts/compare_pre_dart_baselines.py \
            --original "$RUNNER_TEMP/film/Neighbors_native_720p.mkv" \
            --variant arp="$RUNNER_TEMP/film/Neighbors_light_deflicked.mkv" \
            --variant ffmpeg="$RUNNER_TEMP/film/Neighbors_ffmpeg_deflicker.mkv" \
            --output-dir "$RUNNER_TEMP/deflick_results"
          cat "$RUNNER_TEMP/deflick_results/pre_dart_baselines.json"

      - name: Make limited-size original vs corrected side-by-side preview
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i "$RUNNER_TEMP/film/Neighbors_native_720p.mkv" \
            -i "$RUNNER_TEMP/film/Neighbors_light_deflicked.mkv" \
            -filter_complex "[0:v]scale=480:360:flags=lanczos[left];[1:v]scale=480:360:flags=lanczos[right];[left][right]hstack=inputs=2[out]" \
            -map "[out]" -an -t 4 -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p \
            "$RUNNER_TEMP/deflick_results/Neighbors_light_deflicker_before_after.mp4"
          {
            printf 'Left: original 960x720 Wikimedia Commons digital transfer; right: Light Deflicker.\n'
            printf 'Transferred video source: https://commons.wikimedia.org/wiki/File:Neighbors_(1920).webm\n'
            printf 'Source WebM SHA256: '
            sha256sum "$RUNNER_TEMP/film/neighbors_original_960x720.webm" | awk '{print $1}'
            printf 'Excerpt: 00:05:00 to 00:05:04, native 960x720, no AI upscaling or AI restoration.\n'
            printf 'Limitations: This is a digital transfer, not a proven original scan master.\n'
            printf 'Commons asserts US public domain; German commercial rights require separate review.\n'
          } > "$RUNNER_TEMP/deflick_results/SOURCE.txt"

      - name: Upload only short preview and diagnostics, not the full movie
        uses: actions/upload-artifact@v4
        with:
          name: neighbors-native-light-deflicker-comparison
          path: ${{ runner.temp }}/deflick_results/
          retention-days: 30
