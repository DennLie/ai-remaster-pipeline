name: Three-film synthetic scientific CPU benchmark

on:
  pull_request:
    paths:
      - "scripts/run_multifilm_scientific_eval.py"
      - "tests/test_multifilm_scientific_eval.py"
      - "docs/scientific-multifilm-cpu-pilot.md"
      - ".github/workflows/scientific-multifilm-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-film-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install archive/metric dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet "numpy>=2,<3" "opencv-python-headless>=4.10,<5" "scikit-image>=0.25,<0.28" pillow pyyaml
          ffmpeg -hide_banner -filters | grep -E 'vidstabdetect|vidstabtransform|bm3d|hqdn3d|nlmeans'
      - name: Validate benchmark contract on small real FFV1 video
        run: python -m unittest -v tests.test_multifilm_scientific_eval
      - name: Acquire three verified Commons films into ephemeral runner storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film_corpus"
          for film in lumiere_train great_train_robbery melies_moon; do
            python scripts/prepare_public_domain_films.py \
              --film "$film" --no-classical \
              --output-dir "$RUNNER_TEMP/film_corpus/$film"
          done
      - name: Run native ARP Steps 1-5 on three unrelated films
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_multifilm_scientific_eval.py \
            --corpus-root "$RUNNER_TEMP/film_corpus" \
            --films lumiere_train,great_train_robbery,melies_moon \
            --scenes-per-film 1 \
            --stages deflicker,denoise,detail,stabilize,scratch_masks \
            --seed 2026 \
            --output-dir "$RUNNER_TEMP/arp_multifilm_results"
      - name: Collect only provenance and numerical reports (no movie masters)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/research_reports"
          cp "$RUNNER_TEMP/arp_multifilm_results/multifilm_report.json" "$RUNNER_TEMP/research_reports/"
          find "$RUNNER_TEMP/arp_multifilm_results" -type f \( -name 'evaluation.json' -o -name 'stage_report.json' \) -print |
          while IFS= read -r f; do
            rel="${f#"$RUNNER_TEMP/arp_multifilm_results/"}"
            mkdir -p "$RUNNER_TEMP/research_reports/$(dirname "$rel")"
            cp "$f" "$RUNNER_TEMP/research_reports/$rel"
          done
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "research_reports/multifilm_report.json"
          x = json.loads(p.read_text())
          assert len(x["films"]) == 3 and x["stage_runs"] == 15
          assert len(x["film_level_summary"]["results"]) > 0
          print("Scientific pilot: 3 films × 5 stages, numeric rows:", len(x["film_level_summary"]["results"]))
          for row in x["film_level_summary"]["results"]:
              print(row["degradation"], row["algorithm"], row["mean_scene_paired_psnr_delta_db"], row["ci95"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-three-film-step1to5-report
          path: ${{ runner.temp }}/research_reports/
          retention-days: 30
          if-no-files-found: error
