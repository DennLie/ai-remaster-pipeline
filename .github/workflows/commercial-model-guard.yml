name: Commercial model guard (CPU)

on:
  pull_request:
    paths:
      - ".github/workflows/commercial-model-guard.yml"
      - "ai_remaster_gui/**"
      - "tests/test_commercial_policy.py"
      - "tests/test_model_license_inventory.py"
      - "docs/commercial-model-guard.md"
      - "docs/model-license-audit.md"
      - "docs/model-license-inventory.json"
      - "scripts/film_defect_masks.py"
      - "scripts/cleanup_video.py"
      - "scripts/artifact_ids.py"
      - "tests/test_temporal_defect_masks.py"
      - "tests/test_temporal_video_smoke.py"
      - "docs/temporal-defect-masks.md"
      - "scripts/benchmark_defect_masks.py"
      - "tests/test_defect_mask_benchmark.py"
      - "docs/dart-vs-temporal-mask-benchmark.md"
      - ".github/workflows/neighbors-source-resolution.yml"
      - "scripts/compare_source_resolution.py"
      - "tests/test_source_resolution_comparison.py"
      - "docs/neighbors-source-resolution-test.md"
      - "scripts/assess_dart_exports.py"
      - "scripts/run_dart_research.py"
      - "tests/test_dart_exports.py"
      - "tests/test_dart_pinned_runner.py"
      - "docs/dart-external-research-evaluation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python modules
        run: python -m compileall -q ai_remaster_gui scripts tests

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find ai_remaster_gui/static -name '*.js' -print0)

      - name: Install lightweight defect-mask test dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml

      - name: Run temporal film defect tests
        run: python -m unittest -v tests.test_temporal_defect_masks

      - name: Test source-resolution analysis on synthetic video
        run: python -m unittest -v tests.test_source_resolution_comparison

      - name: Validate DART external-mask and repair evaluation (no DART dependency)
        run: python -m unittest -v tests.test_dart_exports tests.test_dart_pinned_runner

      - name: Run film defect mask benchmark tests
        run: python -m unittest -v tests.test_defect_mask_benchmark

      - name: Install FFmpeg for end-to-end video tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run end-to-end FFmpeg mask-only video smoke test
        run: python -m unittest -v tests.test_temporal_video_smoke

      - name: Run commercial model policy tests
        run: python -m unittest -v tests.test_commercial_policy tests.test_model_license_inventory

  original-source-resolution:
    # The Commons download is deliberately on demand; real-video trial completed in run 41339842192.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/neighbors-source-resolution.yml
