name: Commercial model guard (CPU)

on:
  pull_request:
    paths:
      - ".github/workflows/commercial-model-guard.yml"
      - "ai_remaster_gui/**"
      - "tests/test_commercial_policy.py"
      - "tests/test_model_license_inventory.py"
      - "docs/commercial-model-guard.md"
      - "docs/model-license-audit.md"
      - "docs/model-license-inventory.json"
      - "scripts/film_defect_masks.py"
      - "scripts/cleanup_video.py"
      - "scripts/artifact_ids.py"
      - "tests/test_temporal_defect_masks.py"
      - "tests/test_temporal_video_smoke.py"
      - "docs/temporal-defect-masks.md"
      - "scripts/film_deflicker.py"
      - "tests/test_light_deflicker.py"
      - "docs/light-deflicker.md"
      - "scripts/compare_light_deflicker.py"
      - "tests/test_compare_light_deflicker.py"
      - ".github/workflows/neighbors-light-deflicker.yml"
      - "scripts/compare_pre_dart_baselines.py"
      - "tests/test_pre_dart_baselines.py"
      - "docs/pre-dart-baseline-comparison.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python modules
        run: python -m compileall -q ai_remaster_gui scripts tests

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find ai_remaster_gui/static -name '*.js' -print0)

      - name: Install lightweight defect-mask test dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml

      - name: Run temporal film defect tests
        run: python -m unittest -v tests.test_temporal_defect_masks

      - name: Install FFmpeg for end-to-end video tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Test conservative Light Deflicker, including video pipeline
        run: python -m unittest -v tests.test_light_deflicker

      - name: Test original-versus-deflicker visual diagnostics
        run: python -m unittest -v tests.test_compare_light_deflicker

      - name: Compare ARP and FFmpeg Deflicker plus Stabilization no-zoom options
        run: python -m unittest -v tests.test_pre_dart_baselines

      - name: Run end-to-end FFmpeg mask-only video smoke test
        run: python -m unittest -v tests.test_temporal_video_smoke

      - name: Run commercial model policy tests
        run: python -m unittest -v tests.test_commercial_policy tests.test_model_license_inventory

  original-film-deflicker:
    # Run the real 960x720 source test only on the Light Deflicker draft PR.
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/light-deflicker-cpu'
    uses: ./.github/workflows/neighbors-light-deflicker.yml
