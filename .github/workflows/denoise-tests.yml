name: Modular Remove Noise (CPU)

on:
  pull_request:
    paths:
      - "scripts/denoise_video.py"
      - "tests/test_denoise_video.py"
      - "scripts/compare_denoising.py"
      - "tests/test_compare_denoising.py"
      - "docs/denoising-comparison.md"
      - "scripts/detail_enhance_video.py"
      - "scripts/richardson_lucy_video.py"
      - "tests/test_richardson_lucy.py"
      - "docs/richardson-lucy-detail.md"
      - "scripts/run_restormer_deblur_research.py"
      - "tests/test_restormer_deblur_research.py"
      - "docs/restormer-deblur-research.md"
      - "tests/test_detail_enhancement.py"
      - "docs/detail-enhancement-implementation.md"
      - "tests/test_denoise_comparison_browser.test.cjs"
      - "ai_remaster_gui/**"
      - ".github/workflows/denoise-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-denoise-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native tools and minimal Python libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml scikit-image
          ffmpeg -hide_banner -filters | grep -E 'hqdn3d|nlmeans|bm3d'
      - name: Compile all backend modules
        run: python -m compileall -q ai_remaster_gui scripts tests
      - name: Check browser JS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find ai_remaster_gui/static -name '*.js' -print0)
      - name: Test real video and GUI model settings
        run: python -m unittest -v tests.test_denoise_video
      - name: Test Restormer research-only provenance and lossless RGB frame I/O
        run: python -m unittest -v tests.test_restormer_deblur_research
      - name: Test Richardson–Lucy PSFs and controlled synthetic-blur recovery
        run: python -m unittest -v tests.test_richardson_lucy
      - name: Test native 1x detail enhancement methods and GUI chain
        run: python -m unittest -v tests.test_detail_enhancement
      - name: Test synchronized A/B/C browser comparison contracts
        run: node --test tests/test_denoise_comparison_browser.test.cjs
      - name: Test frame-aligned denoising diagnostics
        run: python -m unittest -v tests.test_compare_denoising

  neighbors-native-denoising:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/modular-noise-reduction'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg and minimal dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml scikit-image
          ffmpeg -hide_banner -filters | grep -E 'hqdn3d|nlmeans|bm3d'

      - name: Download original 960x720 Commons digital transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/denoise_results"
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 40 --max-time 660 \
            -A "ARP archival video denoising research (https://github.com/DennLie/ai-remaster-pipeline)" \
            "https://upload.wikimedia.org/wikipedia/commons/2/27/Neighbors_%281920%29.webm" \
            -o "$RUNNER_TEMP/source/Neighbors_uploaded_960x720.webm"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$RUNNER_TEMP/source/Neighbors_uploaded_960x720.webm")" = "960"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$RUNNER_TEMP/source/Neighbors_uploaded_960x720.webm")" = "720"
          sha256sum "$RUNNER_TEMP/source/Neighbors_uploaded_960x720.webm" | tee "$RUNNER_TEMP/denoise_results/source_sha256.txt"

      - name: Extract the exact same 24 consecutive native-resolution source frames
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -ss 00:05:00 \
            -i "$RUNNER_TEMP/source/Neighbors_uploaded_960x720.webm" \
            -frames:v 24 -map 0:v:0 -an -c:v ffv1 -pix_fmt yuv420p \
            "$RUNNER_TEMP/source/neighbors_native_720p_24frames.mkv"
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/source/neighbors_native_720p_24frames.mkv")" = "24"

      - name: Render all three conservative backends separately
        shell: bash
        run: |
          set -euo pipefail
          for method in hqdn3d nlmeans bm3d; do
            python scripts/denoise_video.py \
              --source "$RUNNER_TEMP/source/neighbors_native_720p_24frames.mkv" \
              --output "$RUNNER_TEMP/source/${method}_gentle.mkv" \
              --method "$method" --preset gentle --intermediate-profile lossless
          done

      - name: Create objective descriptive report and source-aligned image sheet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_denoising.py \
            --source "$RUNNER_TEMP/source/neighbors_native_720p_24frames.mkv" \
            --variant "hqdn3d=$RUNNER_TEMP/source/hqdn3d_gentle.mkv" \
            --variant "nlmeans=$RUNNER_TEMP/source/nlmeans_gentle.mkv" \
            --variant "bm3d=$RUNNER_TEMP/source/bm3d_gentle.mkv" \
            --output-dir "$RUNNER_TEMP/denoise_results"
          cat "$RUNNER_TEMP/denoise_results/denoising_comparison.json"

      - name: Generate small synchronized four-way preview
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i "$RUNNER_TEMP/source/neighbors_native_720p_24frames.mkv" \
            -i "$RUNNER_TEMP/source/hqdn3d_gentle.mkv" \
            -i "$RUNNER_TEMP/source/nlmeans_gentle.mkv" \
            -i "$RUNNER_TEMP/source/bm3d_gentle.mkv" \
            -filter_complex "[0:v]scale=320:240[a];[1:v]scale=320:240[b];[2:v]scale=320:240[c];[3:v]scale=320:240[d];[a][b][c][d]hstack=inputs=4[out]" \
            -map "[out]" -an -c:v libx264 -crf 19 -preset fast -pix_fmt yuv420p \
            "$RUNNER_TEMP/denoise_results/Neighbors_denoising_4way.mp4"
          {
            printf 'Left to right: original | hqdn3d gentle | NLMeans gentle | BM3D gentle.\n'
            printf 'Source is the uploaded digital 960x720 WebM, not a verified 35-mm master scan.\n'
            printf '24 frames, 30 fps, from 00:05:00. No DART or neural model used.\n'
            printf 'Comparative numbers do NOT establish restoration quality or grain accuracy.\n'
            printf 'Commons PD status applies to US. German/EU transfer rights require independent review.\n'
          } > "$RUNNER_TEMP/denoise_results/SOURCE.txt"

      - name: Upload comparison outputs without distributing complete film
        uses: actions/upload-artifact@v4
        with:
          name: neighbors-native-denoising-four-method-comparison
          path: ${{ runner.temp }}/denoise_results/
          retention-days: 30

  neighbors-native-detail:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/native-detail-enhancement'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg for genuine film test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml scikit-image
          ffmpeg -hide_banner -filters | grep -E 'unsharp|cas|blend'
      - name: Fetch verified native Neighbors transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film" "$RUNNER_TEMP/detail_results"
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 40 --max-time 660 \
            -A "ARP archival-detail-compare (https://github.com/DennLie/ai-remaster-pipeline)" \
            "https://upload.wikimedia.org/wikipedia/commons/2/27/Neighbors_%281920%29.webm" \
            -o "$RUNNER_TEMP/film/Neighbors_original.webm"
          echo "029c419a9323158ff3f1dcdaae04a2d696c3ba030a750460c01e68733f671966  $RUNNER_TEMP/film/Neighbors_original.webm" | sha256sum --check
          ffmpeg -hide_banner -loglevel error -y -ss 00:05:00 \
            -i "$RUNNER_TEMP/film/Neighbors_original.webm" \
            -frames:v 36 -map 0:v:0 -an -c:v ffv1 \
            "$RUNNER_TEMP/film/neighbors_native.mkv"
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/film/neighbors_native.mkv")" = 36
      - name: Render equal-sized source and 1x detail candidates
        shell: bash
        run: |
          set -euo pipefail
          for method in unsharp cas multiscale; do
            python scripts/detail_enhance_video.py \
              --source "$RUNNER_TEMP/film/neighbors_native.mkv" \
              --output "$RUNNER_TEMP/film/${method}_gentle.mkv" \
              --method "$method" --preset gentle --mix 100 \
              --intermediate-profile lossless
          done
          python scripts/compare_denoising.py \
            --source "$RUNNER_TEMP/film/neighbors_native.mkv" \
            --variant "unsharp=$RUNNER_TEMP/film/unsharp_gentle.mkv" \
            --variant "cas=$RUNNER_TEMP/film/cas_gentle.mkv" \
            --variant "multiscale=$RUNNER_TEMP/film/multiscale_gentle.mkv" \
            --output-dir "$RUNNER_TEMP/detail_results"
          cat "$RUNNER_TEMP/detail_results/denoising_comparison.json"
      - name: Export actual same-frame four-way visual comparison
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i "$RUNNER_TEMP/film/neighbors_native.mkv" \
            -i "$RUNNER_TEMP/film/unsharp_gentle.mkv" \
            -i "$RUNNER_TEMP/film/cas_gentle.mkv" \
            -i "$RUNNER_TEMP/film/multiscale_gentle.mkv" \
            -filter_complex "[0:v]scale=320:240[a];[1:v]scale=320:240[b];[2:v]scale=320:240[c];[3:v]scale=320:240[d];[a][b][c][d]hstack=inputs=4[out]" \
            -map "[out]" -an -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p \
            "$RUNNER_TEMP/detail_results/Neighbors_detail_4way.mp4"
          {
            echo "Original / Unsharp / CAS / Multiscale, gentle preset, each 1x native 960x720 before preview resize."
            echo "36 frames, 30fps, Commons transfer from 00:05:00, not a verified original scan."
            echo "A pixel difference is not evidence of restored detail; sharpening can amplify real grain and film damage."
            echo "This research test uses no trained models or generative enhancement."
            echo "US public-domain listing does not clear all German/EU rights or soundtrack rights."
          } > "$RUNNER_TEMP/detail_results/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: neighbors-native-detail-four-method-comparison
          path: ${{ runner.temp }}/detail_results/
          retention-days: 30

  neighbors-native-deblur:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/richardson-lucy-detail'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install open-source deblurring dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml scikit-image
          ffmpeg -hide_banner -filters | grep -E 'unsharp|cas|blend'
      - name: Download and hash-verify original Neighbors digital transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film" "$RUNNER_TEMP/deblur_results"
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 40 --max-time 660             -A "ARP historic-film native deblur research (https://github.com/DennLie/ai-remaster-pipeline)"             "https://upload.wikimedia.org/wikipedia/commons/2/27/Neighbors_%281920%29.webm"             -o "$RUNNER_TEMP/film/Neighbors_original.webm"
          echo "029c419a9323158ff3f1dcdaae04a2d696c3ba030a750460c01e68733f671966  $RUNNER_TEMP/film/Neighbors_original.webm" | sha256sum --check
          ffmpeg -hide_banner -loglevel error -y -ss 00:05:00             -i "$RUNNER_TEMP/film/Neighbors_original.webm" -map 0:v:0             -frames:v 24 -an -c:v ffv1 -pix_fmt bgr0             "$RUNNER_TEMP/film/neighbors_reference.mkv"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of csv=p=0 "$RUNNER_TEMP/film/neighbors_reference.mkv"
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/film/neighbors_reference.mkv")" = 24
      - name: Render four native 1x candidate algorithms on identical 24 frames
        shell: bash
        run: |
          set -euo pipefail
          for method in unsharp cas multiscale richardson_lucy; do
            python scripts/detail_enhance_video.py               --source "$RUNNER_TEMP/film/neighbors_reference.mkv"               --output "$RUNNER_TEMP/film/${method}_gentle.mkv"               --method "$method" --preset gentle --mix 100               --intermediate-profile lossless
            test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/film/${method}_gentle.mkv")" = 24
          done
      - name: Produce native-frame numerical diagnostics and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compare_denoising.py             --source "$RUNNER_TEMP/film/neighbors_reference.mkv"             --variant "unsharp=$RUNNER_TEMP/film/unsharp_gentle.mkv"             --variant "cas=$RUNNER_TEMP/film/cas_gentle.mkv"             --variant "multiscale=$RUNNER_TEMP/film/multiscale_gentle.mkv"             --variant "richardson_lucy=$RUNNER_TEMP/film/richardson_lucy_gentle.mkv"             --output-dir "$RUNNER_TEMP/deblur_results"
          cat "$RUNNER_TEMP/deblur_results/denoising_comparison.json"
      - name: Encode source-synchronized five-way visual preview
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i "$RUNNER_TEMP/film/neighbors_reference.mkv"             -i "$RUNNER_TEMP/film/unsharp_gentle.mkv"             -i "$RUNNER_TEMP/film/cas_gentle.mkv"             -i "$RUNNER_TEMP/film/multiscale_gentle.mkv"             -i "$RUNNER_TEMP/film/richardson_lucy_gentle.mkv"             -filter_complex "[0:v]scale=288:216[a];[1:v]scale=288:216[b];[2:v]scale=288:216[c];[3:v]scale=288:216[d];[4:v]scale=288:216[e];[a][b][c][d][e]hstack=inputs=5[out]"             -map "[out]" -an -c:v libx264 -crf 18 -preset veryfast             -pix_fmt yuv420p "$RUNNER_TEMP/deblur_results/Neighbors_native_detail_5way.mp4"
          {
            echo "Left to right: Original / Unsharp gentle / CAS gentle / Multiscale gentle / Richardson-Lucy gentle."
            echo "Verified Commons 960x720 WebM transfer SHA-256: 029c419a9323158ff3f1dcdaae04a2d696c3ba030a750460c01e68733f671966"
            echo "24 frames at 30 fps from source 05:00. All analyses performed on equal native 960x720 1x results."
            echo "Richardson-Lucy uses an ASSUMED Gaussian PSF sigma 0.75px, 3 iterations, 100% output mix."
            echo "Increased high-frequency response might mean grain/scratch amplification or ringing, not genuine recovered historical detail."
            echo "No learned models or GPU used; no commercial rights statement for the film transfer."
          } > "$RUNNER_TEMP/deblur_results/METHODOLOGY.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: neighbors-native-5way-deblur-real-source
          path: ${{ runner.temp }}/deblur_results/
          retention-days: 30
