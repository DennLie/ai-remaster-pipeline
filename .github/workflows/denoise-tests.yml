name: Modular Remove Noise (CPU)

on:
  pull_request:
    paths:
      - "scripts/denoise_video.py"
      - "tests/test_denoise_video.py"
      - "ai_remaster_gui/**"
      - ".github/workflows/denoise-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-denoise-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native tools and minimal Python libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check --quiet numpy opencv-python-headless pillow pyyaml
          ffmpeg -hide_banner -filters | grep -E 'hqdn3d|nlmeans|bm3d'
      - name: Compile all backend modules
        run: python -m compileall -q ai_remaster_gui scripts tests
      - name: Check browser JS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find ai_remaster_gui/static -name '*.js' -print0)
      - name: Test real video and GUI model settings
        run: python -m unittest -v tests.test_denoise_video
