<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARP - AI Remaster Pipeline</title>
<link rel="icon" type="image/png" href="/media?path=assets/branding/favicon.png">
<link rel="apple-touch-icon" href="/media?path=assets/branding/arp-app-icon-192.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/comparison-workbench.css">
<link rel="stylesheet" href="/static/comparison-help.css">
</head>
<body>
<header class="workbench-navigation">
  <div class="brand"><img src="/media?path=assets/branding/arp-app-icon-192.png" alt=""><div class="brand-title">ARP</div><span id="workbenchRunStatus" class="workbench-run-status" role="status">Idle</span></div>
  <nav id="tabs" class="tabs" aria-label="Pipeline stages" onfocusin="event.target.closest('.pipeline-tab')?.scrollIntoView({block:'nearest',inline:'nearest'})"></nav>
  <div class="header-actions">
    <button type="button" class="warn" onclick="stopRun()" disabled>Stop</button>
    <details class="workbench-system"><summary>System & info</summary><div>
      <strong>AI Remaster Pipeline <span id="version"></span></strong>
      <div id="root" class="root"></div><div id="systemStatus" class="system-status"></div>
      <div class="system-actions"><button type="button" onclick="refresh(true)">Refresh status</button><button type="button" class="danger" onclick="quitArp()">Quit</button></div>
      <a class="support-link" href="https://buymeacoffee.com/davidaddis" target="_blank" rel="noreferrer" aria-label="Buy me a coffee"><img src="/media?path=assets/branding/bmc-brand-logo.png" alt="Buy me a coffee"></a>
    </div></details>
  </div>
</header>
<main id="app"></main>
<script src="/static/js/core.js"></script>
<script src="/static/js/render-helpers.js"></script>
<script src="/static/js/review-zoom.js"></script>
<script src="/static/js/render-denoise.js"></script>
<script src="/static/js/comparison-layout.js"></script>
<script src="/static/js/comparison-help.js"></script>
<script src="/static/js/render-deflicker.js"></script>
<script src="/static/js/render-enhancement.js"></script>
<script src="/static/js/denoise-playback.js"></script>
<script src="/static/js/denoise-workspace.js"></script>
<script src="/static/js/render-overview.js"></script>
<script src="/static/js/render-outpaint.js"></script>
<script src="/static/js/render-shots.js"></script>
<script src="/static/js/render-recomp.js"></script>
<script src="/static/js/render-cache.js"></script>
<script src="/static/js/actions.js"></script>
<script src="/static/js/frame-masks.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/review-contrast.js"></script>
<script src="/static/js/frame-inspector.js"></script>
<script src="/static/js/cleanup-review.js"></script>
<script src="/static/js/denoise-review.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
